name: ci
on: [push, pull_request]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest paho-mqtt
      - run: python -m pytest -q source/tools/tests

  # Generated and synced files must match their sources.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python source/tools/gen_vectors.py --check
      - run: python source/tools/gen_builtin.py --check
      - run: python source/tools/sync_firmware_common.py --check
      - run: python source/tools/gen_ui_profiles.py --check

  meter-map-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test source/browser-hmi/meter-map/tests/*.test.js

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C source/firmware-esp8266/tests
      - run: make -C source/firmware-esp32-rs485/tests
